# ============================================================
#  TaskFlow API — Integración continua (Prácticas 13 y 14)
#  Corre todas las pruebas (unitarias, integración HTTP y BD)
#  y genera la cobertura con JaCoCo en cada push o pull request.
# ============================================================
name: CI API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas y cobertura (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B clean test

      - name: Resumen de pruebas
        if: always()
        run: |
          echo "## Resultado de las pruebas" >> $GITHUB_STEP_SUMMARY
          grep -h "Tests run:" target/surefire-reports/*.txt >> $GITHUB_STEP_SUMMARY || true
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {mi+=$4; ci+=$5; mb+=$6; cb+=$7} END {printf "\n**Cobertura:** instrucciones %.1f %%, ramas %.1f %%\n", 100*ci/(mi+ci), 100*cb/(mb+cb)}' target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          fi

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-api
          path: |
            target/surefire-reports/
            target/site/jacoco/
